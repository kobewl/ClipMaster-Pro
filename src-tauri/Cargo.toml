[package]
name = "clipmaster-pro"
version = "0.1.0"
description = "ClipMaster Pro 0.01 Beta - 轻量级本地优先剪贴板助手"
authors = ["ClipMaster Pro"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

rusqlite = { version = "0.40.2", features = ["bundled"] }

thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.10.9"
hex = "0.4.3"
unicode-normalization = "0.1.25"
async-trait = "0.1.92"
tauri-plugin-autostart = "2.5.1"

# macOS 剪贴板读写（含图片支持，默认启用 image feature）。
[target.'cfg(target_os = "macos")'.dependencies]
clipboard-rs = "0.3.5"

# 通过 AppKit 取来源应用的真实图标（NSWorkspace），以及模拟 ⌘V。
# 这几个 crate 本来就在 Tauri 的依赖树里（见 Cargo.lock），这里只是显式引用，
# 不引入新的下载量。features 按最小集合开，避免多编译一堆没用的绑定。
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSBitmapImageRep",
    "NSImage",
    "NSImageRep",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
