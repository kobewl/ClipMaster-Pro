[package]
name = "clipmaster-pro"
version = "1.0.7"
description = "ClipMaster Pro 0.01 Beta - 轻量级本地优先剪贴板助手"
authors = ["ClipMaster Pro"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon", "image-png"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

rusqlite = { version = "0.40.2", features = ["bundled"] }

thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.10.9"
hex = "0.4.3"
unicode-normalization = "0.1.25"
async-trait = "0.1.92"
tauri-plugin-autostart = "2.5.1"
# 单实例守卫：只允许一个进程存活，第二个实例把已有实例唤到前台后自己退出。
# 必需的场景：开机时 LaunchAgent 自启与 macOS 的「重启后恢复窗口」（TAL）
# 会各拉起一个实例，于是出现两个菜单栏图标、两个进程抢全局快捷键。
# 硬性要求：必须在所有插件里**第一个**注册（它靠接管第二实例的启动来生效）。
tauri-plugin-single-instance = "2"
# 应用内自动安装更新用的（tauri.conf.json 里的空占位是它的硬性要求）。
# 「检查更新」本身走 GitHub API（见 system_commands.rs），不依赖这个插件；
# 将来接「自动下载安装」时才需要它 —— 那时再生成 minisign 密钥并配置
# pubkey/endpoints（docs/release/RELEASE.md）。
tauri-plugin-updater = "2"
# 前端 openUrl（「前往下载」按钮）靠这个插件；npm 侧已有 @tauri-apps/plugin-opener。
tauri-plugin-opener = "2"

# 检查更新：请求 GitHub API（releases/latest）+ 比较版本号。
# 这两个包已被 tauri-plugin-updater 拉进依赖树，这里只是显式声明使用，零新增下载。
# TLS 用 native-tls（macOS 系统自带）避开默认的 aws-lc-rs（构建需要 cmake）。
# 刻意不启用 system-proxy：reqwest 读了 macOS 系统代理设置后，只要系统里
# 配着失效的代理就会全部请求失败；实测直连 api.github.com 是通的。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
] }
semver = "1"

# 解析用户填的服务地址（模型 API 可以自定义成任何 OpenAI 兼容服务）。
# 不用字符串前缀判断 —— 那分不清 https://evil.com/api.deepseek.com 这种地址。
# 这个 crate 已在依赖树里（reqwest 需要它），显式声明不新增下载。
url = "2"

# macOS 剪贴板读写（含图片支持，默认启用 image feature）。
[target.'cfg(target_os = "macos")'.dependencies]
clipboard-rs = "0.3.5"

# 系统钥匙串：模型 API Key 存这里，不进 SQLite（见 docs/agent/DEEPSEEK_MVP.md）。
# 这个 crate 已经在依赖树里（reqwest 的 native-tls 用它做系统证书校验，见
# Cargo.lock），这里只是显式声明，零新增下载。
security-framework = "3.7"

# 通过 AppKit 取来源应用的真实图标（NSWorkspace），以及模拟 ⌘V。
# 这几个 crate 本来就在 Tauri 的依赖树里（见 Cargo.lock），这里只是显式引用，
# 不引入新的下载量。features 按最小集合开，避免多编译一堆没用的绑定。
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
